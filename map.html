<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  if (!window.L) { $('load-error').hidden = false; return; }
  const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const fmt = value => String(value ?? '').replace(/\s*\([^)]*официальные данные[^)]*\)/gi,'').trim();
  const map = L.map('map', {zoomControl:false, preferCanvas:true, minZoom:5, maxZoom:18, zoomSnap:.25}).setView([50.33,84.06], 9.5);
  L.control.zoom({position:'bottomright'}).addTo(map);
  const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · <a href="https://opentopomap.org" target="_blank" rel="noopener">OpenTopoMap</a>'});
  const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'});
  const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © <a href="https://www.esri.com/" target="_blank" rel="noopener">Esri</a>'});
  const bases={topo,osm,sat}; topo.addTo(map);
  let routesData=JSON.parse($('routes-embedded').textContent), placesData=JSON.parse($('places-embedded').textContent);
  const routeLayers=new Map(), placeMarkers=new Map();
  let activeTab='routes', selectedRoute=null, selectedBase='topo';
  const routeBounds=[];
  const imgFallback='';
  function coordsText(xy){return `${Number(xy[1]).toFixed(5)}, ${Number(xy[0]).toFixed(5)}`;}
  function lineLengthInfo(p){return p.total_km || '';}
  function shortTransport(text){return String(text||'').replace('Автомобильный + пеший / конный','Авто · пешком / верхом').replace('Автомобильный + велосипедный','Авто · велосипед').replace('Автомобильный + пеший','Авто · пешком').replace('Автомобильный','Авто').replace('Велосипедный','Велосипед');}
  function simpleDuration(value){if(!value)return '';if(value.includes('по плакату')||value.includes('официальные'))return value.split(';')[0].replace(' по плакату','').replace(' (официальные описания)','');return value;}
  function routePopup(p){
    const season=p.season?`<p class="popup-meta">${esc(p.duration||'')} · ${esc(p.season)}</p>`:'';
    const stops=p.stops&&p.stops.length?`<p class="popup-desc"><strong>По пути:</strong> ${esc(p.stops.join(' · '))}</p>`:'';
    const geometryNote=p.geometry_note?`<p class="popup-source-note">${esc(p.geometry_note)}</p>`:'';
    return `<div class="popup"><div class="popup-body"><h3 class="popup-title">${esc(p.name)}</h3><p class="popup-meta">${esc(p.total_km||'')} · ${esc(shortTransport(p.transport))}</p><p class="popup-desc">${esc(p.description||'')}</p>${stops}${season}${geometryNote}<a class="popup-link" href="${esc(p.source||'https://zagpz.kz/ru/marshruty-zagpz/') }" target="_blank" rel="noopener">Описание маршрута ↗</a></div></div>`;
  }
  function placePopup(p, xy){
    const photo=p.image?`<img class="popup-image" src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy" onerror="this.style.display='none'">`:'';
    const meta=[p.kind,p.elevation_m?`${Number(p.elevation_m).toLocaleString('ru-RU')} м`:null].filter(Boolean).join(' · ');
    return `<div class="popup">${photo}<div class="popup-body"><h3 class="popup-title">${esc(p.name.replace(/\s*\([^)]*\)/g,''))}</h3>${meta?`<p class="popup-meta">${esc(meta)}</p>`:''}<p class="popup-desc">${esc(p.description||'')}</p>${p.source?`<a class="popup-link" href="${esc(p.source)}" target="_blank" rel="noopener">Подробнее ↗</a>`:''}</div></div>`;
  }
  function markerIcon(kind){
    const k=String(kind||'').toLocaleLowerCase('ru');
    let glyph='✦', cl='';
    if(k.includes('озер')||k.includes('озёр')){glyph='≈';cl='lake'}
    else if(k.includes('вершин')||k.includes('пик')){glyph='▲';cl='peak'}
    else if(k.includes('ручей')||k.includes('водоток')){glyph='⌁';cl='stream'}
    else if(k.includes('болот')){glyph='❋';cl='wetland'}
    else if(k.includes('скал')){glyph='◆';cl='rock'}
    else if(k.includes('перевал')){glyph='⌃';cl='pass'}
    return L.divIcon({className:'',html:`<div class="map-marker ${cl}"><span>${glyph}</span></div>`,iconSize:[28,28],iconAnchor:[14,27],popupAnchor:[0,-25]});
  }
  function fitAll(){
    const bounds=L.latLngBounds([]);
    routeLayers.forEach(layer=>{const b=layer.getBounds();if(b&&b.isValid())bounds.extend(b)});

    if(bounds.isValid()) map.fitBounds(bounds.pad(.10),{maxZoom:10.5,animate:true});
  }
  function focusRoute(id){
    const layer=routeLayers.get(id), route=routesData.features.find(f=>f.properties.id===id);

    map.fitBounds(layer.getBounds().pad(.2),{maxZoom:12,animate:true});
    let popupOpened=false;layer.eachLayer(child=>{if(!popupOpened&&typeof child.openPopup==='function'){child.openPopup();popupOpened=true;}});
  }
  function setActiveTab(tab){
    activeTab=tab;
    document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
    $('route-list').hidden=tab!=='routes'; $('place-list').hidden=tab!=='places';
    renderCurrentList();
  }
  function renderRoutes(){
    const q=$('search').value.trim().toLocaleLowerCase('ru');
    const fs=routesData.features.filter(f=>`${f.properties.name} ${f.properties.description} ${f.properties.transport}`.toLocaleLowerCase('ru').includes(q));
    $('route-count').textContent=fs.length;
    $('route-list').innerHTML=fs.map(f=>{
      const p=f.properties||{},active=selectedRoute===p.id,hasGeometry=!!f.geometry;
      return `<button type="button" class="route-item ${active?'selected':''} ${hasGeometry?'':'no-geometry'}" data-route="${esc(p.id)}" style="--route:${esc(p.color||'#a0aaa1')}"><span class="route-symbol" aria-hidden="true"></span><span class="route-copy"><span class="route-title">${esc(p.name)}${hasGeometry?'':' <span class=\"route-status\">нет линии</span>'}</span><span class="route-meta"><span class="length">${esc(lineLengthInfo(p))}</span><span>${esc(shortTransport(p.transport))}</span></span>${active?`<span class="route-desc">${esc(p.description||'')}${p.stops&&p.stops.length?`<br><strong>Ориентиры:</strong> ${esc(p.stops.slice(0,4).join(' · '))}`:''}${p.season?`<br><strong>${esc(p.duration||'')}</strong> · ${esc(p.season)}`:''}${p.geometry_note?`<span class="route-source-note">${esc(p.geometry_note)}</span>`:''}</span>`:''}</span><svg class="route-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>`;
    }).join('') || '<div class="empty">Ничего не найдено</div>';
    $('route-list').querySelectorAll('[data-route]').forEach(btn=>btn.addEventListener('click',()=>{const f=routesData.features.find(x=>String(x.properties.id)===btn.dataset.route);if(f&&f.geometry)focusRoute(btn.dataset.route);else{selectedRoute=btn.dataset.route;renderRoutes();}}));
  }
  function renderPlaces(){
    const q=$('search').value.trim().toLocaleLowerCase('ru');
    const fs=placesData.features.filter(f=>`${f.properties.name} ${f.properties.description} ${f.properties.kind}`.toLocaleLowerCase('ru').includes(q));
    $('place-count').textContent=fs.length;
    $('place-list').innerHTML=fs.map(f=>{
      const p=f.properties,xy=f.geometry.coordinates;
      const name=p.name.replace(/\s*\([^)]*\)/g,'');
      const meta=[p.kind,p.elevation_m?`${Number(p.elevation_m).toLocaleString('ru-RU')} м`:null].filter(Boolean).join(' · ');
      return `<button class="place-item" type="button" data-place="${esc(p.id)}"><img class="place-thumb" src="${esc(p.image||'')}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><span class="place-copy"><span class="place-title">${esc(name)}</span><span class="place-meta">${esc(meta)}</span></span></button>`;
    }).join('') || '<div class="empty">Ничего не найдено</div>';
    $('place-list').querySelectorAll('[data-place]').forEach(btn=>btn.addEventListener('click',()=>{
      const m=placeMarkers.get(btn.dataset.place);if(m){map.setView(m.getLatLng(),13,{animate:true});m.openPopup();}
    }));
  }
  function renderCurrentList(){if(activeTab==='routes')renderRoutes();else renderPlaces();}
  function setBase(name){if(!bases[name])return;Object.values(bases).forEach(layer=>{if(map.hasLayer(layer))map.removeLayer(layer)});bases[name].addTo(map);selectedBase=name;document.querySelectorAll('[data-base]').forEach(b=>b.classList.toggle('active',b.dataset.base===name));}
  document.querySelectorAll('[data-base]').forEach(btn=>btn.addEventListener('click',()=>setBase(btn.dataset.base)));
  document.querySelectorAll('[data-tab]').forEach(btn=>btn.addEventListener('click',()=>setActiveTab(btn.dataset.tab)));
  $('search').addEventListener('input',()=>{$('clear-search').classList.toggle('show',!!$('search').value);renderCurrentList()});
  $('clear-search').addEventListener('click',()=>{$('search').value='';$('clear-search').classList.remove('show');renderCurrentList();$('search').focus()});
  $('fit-map').addEventListener('click',fitAll); $('zoom-home').addEventListener('click',fitAll);
  $('close-panel').addEventListener('click',()=>{$('panel').classList.add('hidden');$('reopen-panel').classList.add('show');setTimeout(()=>map.invalidateSize(),260)});
  $('reopen-panel').addEventListener('click',()=>{$('panel').classList.remove('hidden');$('reopen-panel').classList.remove('show');setTimeout(()=>map.invalidateSize(),260)});
  try {
    if(!routesData || !Array.isArray(routesData.features) || !placesData || !Array.isArray(placesData.features)) throw new Error('Embedded data is invalid');
    routesData.features.forEach(f=>{
      const pr=f.properties||{};
      if(!f.geometry || !f.properties) return;
      const id=String(pr.id);
      L.geoJSON(f,{style:{color:'#ffffff',weight:9,opacity:.94,lineCap:'round',lineJoin:'round'},interactive:false}).addTo(map);
      const colored=L.geoJSON(f,{style:{color:pr.color||'#527b5b',weight:5,opacity:.98,lineCap:'round',lineJoin:'round'},onEachFeature:(feature,child)=>{
        child.bindPopup(routePopup(pr),{maxWidth:280});
        child.on('click',()=>{selectedRoute=id;setActiveTab('routes');renderRoutes();});
      }}).addTo(map);
      routeLayers.set(id,colored);
    });
    placesData.features.forEach(f=>{
      if(!f.geometry || f.geometry.type!=='Point') return;
      const p=f.properties||{},xy=f.geometry.coordinates;
      const marker=L.marker([xy[1],xy[0]],{icon:markerIcon(p.kind),title:p.name||'',keyboard:true}).addTo(map);
      marker.bindPopup(placePopup(p,xy),{maxWidth:280});placeMarkers.set(String(p.id),marker);
    });
    renderRoutes();renderPlaces();fitAll();
  } catch(err) {
    console.error('Map data initialization failed:',err);
    $('route-list').innerHTML='<div class="empty">Не удалось прочитать данные карты. Проверь JSON в папке data.</div>';
  }
  window.addEventListener('resize',()=>map.invalidateSize());
})();
</script>
</body>
</html>
