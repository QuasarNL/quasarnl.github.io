<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const routesData=JSON.parse($('routesData').textContent);

const ROUTES=routesData.features.filter(f=>f.geometry&&f.geometry.type==='LineString');

const MIN_ZOOM=6,MAX_ZOOM=18;
const defaultCenter=[84.15,50.36];

const tileEls=new Map();

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function project(lon,lat,z){lat=Math.max(-85.05112878,Math.min(85.05112878,lat));const n=Math.pow(2,z)*256;const x=(lon+180)/360*n;const rad=lat*Math.PI/180;const y=(1-Math.asinh(Math.tan(rad))/Math.PI)/2*n;return [x,y]}
function unproject(x,y,z){const n=Math.pow(2,z)*256;const lon=x/n*360-180;const k=Math.PI-2*Math.PI*y/n;const lat=Math.atan(Math.sinh(k))*180/Math.PI;return [lon,lat]}
function size(){return [Math.max(1,view.clientWidth),Math.max(1,view.clientHeight)]}
function setCenter(lon,lat){[centerX,centerY]=project(lon,lat,zoom);constrainCenter()}
function currentCenter(){return unproject(centerX,centerY,zoom)}
function constrainCenter(){const [,h]=size();const world=256*Math.pow(2,zoom);const minY=h/2,maxY=world-h/2;if(maxY<minY)centerY=world/2;else centerY=Math.max(minY,Math.min(maxY,centerY));}

function tileWanted(){const [w,h]=size();const n=Math.pow(2,zoom);const x0=Math.floor((centerX-w/2)/256)-1,x1=Math.floor((centerX+w/2)/256)+1,y0=Math.max(0,Math.floor((centerY-h/2)/256)-1),y1=Math.min(n-1,Math.floor((centerY+h/2)/256)+1);const want=new Set();

function renderRoutes(){const [w,h]=size();svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.setAttribute('width',w);svg.setAttribute('height',h);if(!showRoutes){svg.innerHTML='';return}
 const ns='http://www.w3.org/2000/svg';const frag=document.createDocumentFragment();for(const f of ROUTES){const p=f.properties||{},g=document.createElementNS(ns,'g');g.dataset.route=String(p.id);let d='';for(let i=0;i<f.geometry.coordinates.length;i++){const c=f.geometry.coordinates[i];const [x,y]=screenXY(c[0],c[1]);d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)+' ';}
 const halo=document.createElementNS(ns,'path');halo.setAttribute('d',d);halo.setAttribute('class','route-halo');halo.setAttribute('stroke','#ffffff');halo.dataset.route=String(p.id);
 const line=document.createElementNS(ns,'path');line.setAttribute('d',d);line.setAttribute('class','route-line'+(selectedRoute===p.id?' selected':''));line.setAttribute('stroke',p.color||'#d8f078');line.dataset.route=String(p.id);g.append(halo,line);frag.appendChild(g);}

function placeGlyph(kind){const k=String(kind||'').toLowerCase();if(k.includes('озер'))return ['≈','lake'];if(k.includes('вершин')||k.includes('пик'))return ['▲','peak'];if(k.includes('ручей')||k.includes('водоток'))return ['⌁','stream'];if(k.includes('болот'))return ['❋','wetland'];if(k.includes('скал'))return ['◆','rock'];if(k.includes('перевал'))return ['⌃','pass'];return ['✦',''];}
function renderMarkers(){markersEl.replaceChildren();if(!showPlaces)return;for(const f of PLACES){const p=f.properties||{},c=f.geometry.coordinates,[x,y]=screenXY(c[0],c[1]);if(x<-40||y<-40||x>view.clientWidth+40||y>view.clientHeight+40)continue;const [glyph,cl]=placeGlyph(p.kind);const b=document.createElement('button');b.type='button';b.className='marker '+cl;b.style.left=x+'px';b.style.top=y+'px';b.title=p.name||'';b.setAttribute('aria-label',p.name||'Объект');b.dataset.place=String(p.id);b.innerHTML='<span>'+esc(glyph)+'</span>';markersEl.appendChild(b)}}
function render(){constrainCenter();tileWanted();renderRoutes();renderMarkers()}
function fitCoords(coords,maxZoom=MAX_ZOOM){if(!coords||!coords.length)return;let minLon=Infinity,minLat=Infinity,maxLon=-Infinity,maxLat=-Infinity;for(const c of coords){minLon=Math.min(minLon,c[0]);maxLon=Math.max(maxLon,c[0]);minLat=Math.min(minLat,c[1]);maxLat=Math.max(maxLat,c[1]);}const [w,h]=size();let chosen=MIN_ZOOM,mid=[(minLon+maxLon)/2,(minLat+maxLat)/2];for(let z=Math.min(maxZoom,MAX_ZOOM);z>=MIN_ZOOM;z--){const a=project(minLon,maxLat,z),b=project(maxLon,minLat,z);if((b[0]-a[0])<=w-100&&(b[1]-a[1])<=h-130){chosen=z;break;}}zoom=chosen;[centerX,centerY]=project(mid[0],mid[1],zoom);constrainCenter();render()}
function fitAll(){const coords=[];for(const f of ROUTES)coords.push(...f.geometry.coordinates);fitCoords(coords,MAX_ZOOM);}
function fitRoute(id){const f=ROUTES.find(x=>String(x.properties.id)===String(id));if(!f)return;selectedRoute=id;selectedPlace=null;fitCoords(f.geometry.coordinates,MAX_ZOOM);showInfoRoute(f);}
function showInfoRoute(f){const p=f.properties||{};$('infoContent').innerHTML=`<h3>${esc(p.name)}</h3><div class="meta">${esc(p.total_km||'')}${p.transport?' · '+esc(p.transport):''}${p.duration?' · '+esc(p.duration):''}</div><p>${esc(p.description||'')}</p>${p.stops&&p.stops.length?'<p><strong>Ориентиры:</strong> '+esc(p.stops.join(' · '))+'</p>':''}${p.season?'<p><strong>Сезон:</strong> '+esc(p.season)+'</p>':''}`;$('infoCard').hidden=false;renderRoutes();}
function showInfoPlace(f){const p=f.properties||{};selectedPlace=p.id;selectedRoute=null;$('infoContent').innerHTML=`<h3>${esc(p.name)}</h3><div class="meta">${esc(p.kind||'Природный объект')}${p.elevation_m?' · '+esc(p.elevation_m)+' м':''}</div><p>${esc(p.description||'')}</p>`;$('infoCard').hidden=false;}
function renderRouteList(){const q=$('routeSearch').value.trim().toLocaleLowerCase('ru');const fs=ALLROUTES.filter(f=>{const p=f.properties||{};return [p.name,p.description,p.transport].join(' ').toLocaleLowerCase('ru').includes(q)});$('routeList').innerHTML=fs.map(f=>{const p=f.properties||{},has=!!f.geometry;return `<button class="route-item ${String(selectedRoute)===String(p.id)?'selected':''}" data-route="${esc(p.id)}"><span class="swatch" style="background:${esc(p.color||'#64748b')}"></span><span class="route-text"><span class="route-name">${esc(p.name)}</span><span class="route-meta">${esc(p.total_km||'')} · ${esc(p.transport||'')}</span>${String(selectedRoute)===String(p.id)?'<span class="route-desc">'+esc(p.description||'')+'</span>':''}</span></button>`}).join('')||'<div class="empty-note">Маршруты не найдены</div>';}
function setZoom(next,anchor){next=Math.max(MIN_ZOOM,Math.min(MAX_ZOOM,next));if(next===zoom)return;const [w,h]=size();const [lon,lat]=anchor?unproject(centerX+(anchor.x-w/2),centerY+(anchor.y-h/2),zoom):currentCenter();zoom=next;[centerX,centerY]=project(lon,lat,zoom);if(anchor){const [ax,ay]=project(lon,lat,zoom);centerX=ax-(anchor.x-w/2);centerY=ay-(anchor.y-h/2)}render()}

$('openRouteList').addEventListener('click',()=>{$('routeDrawer').hidden=false;$('menu').hidden=true;$('menuToggle').setAttribute('aria-expanded','false');renderRouteList()});$('closeDrawer').addEventListener('click',()=>$('routeDrawer').hidden=true);
$('routeSearch').addEventListener('input',renderRouteList);$('fitAll').addEventListener('click',()=>{$('menu').hidden=true;fitAll()});$('home').addEventListener('click',fitAll);$('zoomIn').addEventListener('click',()=>setZoom(zoom+1));$('zoomOut').addEventListener('click',()=>setZoom(zoom-1));$('closeCard').addEventListener('click',()=>$('infoCard').hidden=true);
$('routeList').addEventListener('click',e=>{const b=e.target.closest('[data-route]');if(!b)return;const id=b.dataset.route;const f=ROUTES.find(x=>String(x.properties.id)===id);if(f){$('routeDrawer').hidden=true;fitRoute(id)}else{const f0=ALLROUTES.find(x=>String(x.properties.id)===id);if(f0){selectedRoute=id;renderRouteList();showInfoRoute(f0);}}});
svg.addEventListener('click',e=>{const g=e.target.closest('[data-route]');if(g)fitRoute(g.dataset.route)});markersEl.addEventListener('click',e=>{const b=e.target.closest('[data-place]');if(!b)return;const f=PLACES.find(x=>String(x.properties.id)===b.dataset.place);if(f)showInfoPlace(f)});
let pointer=null,moved=false,lastX=0,lastY=0,downRoute=null;view.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;pointer=e.pointerId;moved=false;downRoute=e.target.closest('[data-route]')?.dataset.route||null;lastX=e.clientX;lastY=e.clientY;view.setPointerCapture(pointer);view.classList.add('dragging')});view.addEventListener('pointermove',e=>{if(pointer!==e.pointerId)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;if(Math.abs(dx)+Math.abs(dy)>1)moved=true;centerX-=dx;centerY-=dy;lastX=e.clientX;lastY=e.clientY;render()});function stopDrag(e){if(pointer===null||e.pointerId!==pointer)return;const tapped=!moved?downRoute:null;pointer=null;downRoute=null;view.classList.remove('dragging');if(tapped)fitRoute(tapped)}view.addEventListener('pointerup',stopDrag);view.addEventListener('pointercancel',stopDrag);
view.addEventListener('wheel',e=>{e.preventDefault();if(Math.abs(e.deltaY)>0)setZoom(zoom+(e.deltaY<0?1:-1),{x:e.clientX,y:e.clientY})},{passive:false});document.addEventListener('keydown',e=>{if(e.key==='+'||e.key==='=')setZoom(zoom+1);if(e.key==='-'||e.key==='_')setZoom(zoom-1);if(e.key==='Escape'){$('menu').hidden=true;$('routeDrawer').hidden=true;$('infoCard').hidden=true}});
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(render,80)});
setCenter(defaultCenter[0],defaultCenter[1]);fitAll();renderRouteList();
})();
</script>
</body>
</html>
